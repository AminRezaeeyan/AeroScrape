# promtool unit tests for alerts.yml: make check-monitoring
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  - name: error rate above 5% for 10 minutes fires, a short spike doesn't
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="api", status="2xx", handler="/v1/predict"}'
        values: '0+90x30'
      - series: 'http_requests_total{job="api", status="5xx", handler="/v1/predict"}'
        values: '0+10x30'
    alert_rule_test:
      - {eval_time: 8m, alertname: ApiHighErrorRate, exp_alerts: []}
      - eval_time: 20m
        alertname: ApiHighErrorRate
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "More than 5% of API requests fail (10%)."}

  - name: a board empty for 12 hours fires; a quiet night, or a board that is always empty, doesn't
    interval: 3h
    input_series:
      # busy, then empty from 6h on; one night-time gap at a small airport; one that's never had flights
      - {series: 'scraped_rows{job="ingest_scrape", airport="فرودگاه مهرآباد"}', values: '412 398 0 0 0 0 0'}
      - {series: 'scraped_rows{job="ingest_scrape", airport="فرودگاه یزد"}', values: '10 12 0 0 9 11 10'}
      - {series: 'scraped_rows{job="ingest_scrape", airport="فرودگاه زابل"}', values: '0 0 0 0 0 0 0'}
    alert_rule_test:
      - {eval_time: 9h, alertname: AirportBoardEmpty, exp_alerts: []}
      - eval_time: 18h
        alertname: AirportBoardEmpty
        exp_alerts:
          - exp_labels: {severity: warning, job: ingest_scrape, airport: "فرودگاه مهرآباد"}
            exp_annotations: {summary: "No rows from فرودگاه مهرآباد for 12 hours, though it had flights this week."}

  - name: three degraded days fire, two don't
    interval: 1m
    input_series:
      - {series: 'live_mae_degraded_days{job="monitor_performance", model_version="5"}', values: '2 3'}
    alert_rule_test:
      - {eval_time: 0m, alertname: LiveMaeDegraded, exp_alerts: []}
      - eval_time: 1m
        alertname: LiveMaeDegraded
        exp_alerts:
          - exp_labels: {severity: warning, job: monitor_performance, model_version: "5"}
            exp_annotations: {summary: "Live MAE has been more than 25% above offline MAE for 3 days (model 5)."}

  - name: drift in any input fires
    interval: 1m
    input_series:
      - {series: 'drift_features_over_threshold{job="monitor_drift", model_version="5"}', values: '0 1'}
    alert_rule_test:
      - {eval_time: 0m, alertname: InputDrift, exp_alerts: []}
      - eval_time: 1m
        alertname: InputDrift
        exp_alerts:
          - exp_labels: {severity: warning, job: monitor_drift, model_version: "5"}
            exp_annotations: {summary: "1 model inputs drifted from the training data; see the drift report."}

  - name: low coverage fires
    interval: 1m
    input_series:
      - {series: 'live_interval_coverage{job="monitor_performance", model_version="5"}', values: '0.6'}
    alert_rule_test:
      - eval_time: 0m
        alertname: LiveCoverageLow
        exp_alerts:
          - exp_labels: {severity: warning, job: monitor_performance, model_version: "5"}
            exp_annotations: {summary: "Only 60% of flights fell inside the 10-90% range (target 80%)."}

  - name: a page that failed fires with its airport
    interval: 1m
    input_series:
      - {series: 'scrape_page_failed{job="ingest_scrape", airport="فرودگاه یزد"}', values: '1'}
      - {series: 'scrape_page_failed{job="ingest_scrape", airport="فرودگاه مشهد"}', values: '0'}
    alert_rule_test:
      - eval_time: 0m
        alertname: ScrapePageFailed
        exp_alerts:
          - exp_labels: {severity: warning, job: ingest_scrape, airport: "فرودگاه یزد"}
            exp_annotations: {summary: "The board of فرودگاه یزد couldn't be fetched after retries, or its layout changed."}
