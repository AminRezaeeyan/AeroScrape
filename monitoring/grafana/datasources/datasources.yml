apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Daily live metrics, read with a role that can see only that table
  - name: Flight database
    uid: flightdb
    type: grafana-postgresql-datasource
    url: db:5432
    user: $GRAFANA_DB_USER
    jsonData:
      database: $DB_NAME
      sslmode: disable
      postgresVersion: 1300
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
