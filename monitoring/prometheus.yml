# Prometheus scrapes the API directly and batch jobs through the Pushgateway.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [alerts.yml]

# Firing alerts go to Alertmanager, which groups them and notifies Telegram
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: pushgateway
    honor_labels: true   # keep the job label each batch job pushed with
    static_configs: [{targets: ["pushgateway:9091"]}]
