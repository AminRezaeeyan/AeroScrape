networks:
  flight_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:

services:
  db:
    image: postgres:13
    container_name: flight_db
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER:?Set DB_ADMIN_USER in .env}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      - POSTGRES_DB=${DB_NAME}
      - APP_DB_USER=${DB_USER}
      - APP_DB_PASSWORD=${DB_PASSWORD}
      - AIRFLOW_DB_NAME=${AIRFLOW_DB_NAME}
      - AIRFLOW_DB_USER=${AIRFLOW_DB_USER}
      - AIRFLOW_DB_PASSWORD=${AIRFLOW_DB_PASSWORD}
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    networks:
      - flight_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    container_name: mlflow_server
    command: mlflow server --backend-store-uri sqlite:////mlruns/mlruns.db --default-artifact-root /mlruns --host 0.0.0.0
    volumes:
      - ./mlruns:/mlruns
    ports:
      - "5000:5000"
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@db:${DB_PORT}/${AIRFLOW_DB_NAME}
      - AIRFLOW_ADMIN_USER=${AIRFLOW_ADMIN_USER}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
      - AIRFLOW_ADMIN_EMAIL=${AIRFLOW_ADMIN_EMAIL}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns             
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.yaml:/opt/airflow/config.yaml
      - ./src:/opt/airflow/src
    ports:
      - "8080:8080"
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        set -e
        : "$${AIRFLOW_ADMIN_USER:?Set AIRFLOW_ADMIN_USER in .env}"
        : "$${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
        airflow db migrate
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USER" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
        exec airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@db:${DB_PORT}/${AIRFLOW_DB_NAME}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns            
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.yaml:/opt/airflow/config.yaml
      - ./src:/opt/airflow/src
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      airflow-webserver:
        condition: service_healthy
    command: airflow scheduler

  api:
    build: .
    container_name: flight_api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /opt/airflow
    command: uvicorn aeroscrape.serving.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./mlruns:/mlruns           
      - ./config.yaml:/opt/airflow/config.yaml
    ports:
      - "8000:8000"
    networks:
      - flight_network
    depends_on:
      mlflow:
        condition: service_started

  scraper:
    build: .
    container_name: flight_scraper_cli
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /opt/airflow
    command: aeroscrape
    volumes:
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns             
      - ./config.yaml:/opt/airflow/config.yaml
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  demo:
    build: .
    container_name: flight_demo
    environment:
      - BACKEND_URL=http://api:8000/predict
    working_dir: /opt/airflow
    command: streamlit run src/aeroscrape/demo/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./src:/opt/airflow/src
      - ./config.yaml:/opt/airflow/config.yaml
    ports:
      - "8501:8501"
    networks:
      - flight_network
    depends_on:
      api:
        condition: service_started
