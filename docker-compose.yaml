networks:
  flight_network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:

services:
  db:
    image: postgres:13
    container_name: flight_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./init/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - flight_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    container_name: mlflow_server
    env_file:
      - .env
    command: mlflow server --backend-store-uri sqlite:////mlruns/mlruns.db --default-artifact-root /mlruns --host 0.0.0.0
    volumes:
      - ./mlruns:/mlruns
    ports:
      - "5000:5000"
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    env_file:
      - .env
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns             
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.yaml:/opt/airflow/config.yaml
      - ./scripts:/opt/airflow/scripts
      - ./utils:/opt/airflow/utils
    ports:
      - "8080:8080"
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    entrypoint: |
          sh -c "
            airflow db init &&
            (airflow users create \
              --username admin \
              --firstname admin \
              --lastname admin \
              --role Admin \
              --email admin@example.com \
              --password admin || true) &&
            airflow webserver
          "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    env_file:
      - .env
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns            
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./config.yaml:/opt/airflow/config.yaml
      - ./scripts:/opt/airflow/scripts
      - ./utils:/opt/airflow/utils
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      airflow-webserver:
        condition: service_healthy
    command: airflow scheduler

  api:
    build: .
    container_name: flight_api
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /opt/airflow
    command: uvicorn src.api_service:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/opt/airflow/src
      - ./models:/opt/airflow/models
      - ./mlruns:/mlruns           
      - ./config.yaml:/opt/airflow/config.yaml
      - ./utils:/opt/airflow/utils
    ports:
      - "8000:8000"
    networks:
      - flight_network
    depends_on:
      mlflow:
        condition: service_started

  scraper:
    build: .
    container_name: flight_scraper_cli
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    working_dir: /opt/airflow
    command: python src/cli.py
    volumes:
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./mlruns:/mlruns             
      - ./utils:/opt/airflow/utils
      - ./config.yaml:/opt/airflow/config.yaml
    networks:
      - flight_network
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
  frontend:
      build: .
      container_name: flight_frontend
      environment:
        - BACKEND_URL=http://api:8000/predict
      working_dir: /opt/airflow
      command: streamlit run src/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
      volumes:
        - ./src:/opt/airflow/src
        - ./config.yaml:/opt/airflow/config.yaml
        - ./utils:/opt/airflow/utils
      ports:
        - "8501:8501"
      networks:
        - flight_network
      depends_on:
        api:
          condition: service_started
