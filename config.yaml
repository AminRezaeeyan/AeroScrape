# Data Paths (relative to project root)
data_paths:
  raw_data: "data/raw/data.csv"
  runs_dir: "data/runs/"   # each DAG run's intermediate files, removed by its cleanup task

# Association Mining
association_mining:
  min_support: 0.02
  min_threshold: 1
  results:
    path: "data/mining/results"
    association_rules_filename: "association_rules.csv"

# Features: computed in aeroscrape.features.build, grouped so models and the ablation
# can be assembled from groups. Each group lists numerical and categorical columns.
features:
  prediction_lead_minutes: 60         # live features use only what was known this long before departure
  inbound_window_hours: 6             # how far back to look for the aircraft's inbound arrival
  previous_departure_window_hours: 12
  rate_window_days: 7                 # historical rates use the 7 days before the flight's date
  rate_smoothing: 20                  # shrink rates of rare airlines and routes toward the overall rate
  groups:
    calendar:
      numerical: ["Scheduled_Hour_of_Day", "scheduled_minute"]
      categorical: ["scheduled_day_of_week", "is_weekend", "scheduled_time_of_day"]
    identity:
      categorical: ["airline", "destination_or_origin", "aircraft", "airport"]
    rotation:          # from the schedule, known when the flight is booked
      numerical: ["has_inbound", "scheduled_turnaround_min", "nth_flight_of_day_for_aircraft"]
    congestion:        # scheduled traffic, known in advance
      numerical: ["departures_same_hour", "airline_departures_today"]
    rates:             # outcomes of earlier days only
      numerical: ["airline_delay_rate_7d", "route_median_delay_7d"]
    live_propagation:  # actual delays of the same aircraft, known 1 hour before departure
      numerical: ["prev_departure_delay_min", "inbound_delay_min", "inbound_overdue_min"]
  # Season and holiday flags (add_seasonal_features) are left out: they are constant
  # within a three-week window. Add a group for them once the data spans a year.
  # Congestion is left out of the models: the counts come from what was scraped, and scrapes per
  # day varied 277-688 departures, so they measure scraping effort (correlation 0.70 with the
  # day's delay share), not traffic. It stays in the ablation for transparency.
  variants:
    booking: ["calendar", "identity", "rotation", "rates"]
    pre_departure: ["calendar", "identity", "rotation", "rates", "live_propagation"]
  served_variant: "booking"           # the API can't look up live features until Phase 4
  ablation: [["calendar", "identity"], ["rotation"], ["congestion"], ["rates"], ["live_propagation"]]

# Evaluation: split by scheduled time, never at random, so the test set is the future
evaluation:
  time_column: "scheduled_datetime"
  train_end: "2025-06-06"   # train: scheduled before this date
  val_end: "2025-06-10"     # val: [train_end, val_end); test: from val_end on
  cv_splits: 4              # rolling-origin folds over train+val for tuning
  bootstrap_samples: 1000
  confidence_level: 0.95
  report_path: "reports/evaluation.md"

# Machine Learning Pipeline Configurations
pipeline:
  # One registered model: calibrated probability, delay range and threshold (models/delay_model.py)
  model_registry_name: "flight-delay-model"
  model_alias_for_api: "production"
  random_state: 42
  delay_threshold_minutes: 15
  model_output_dir: "models/"
  log_file: "logs/pipeline.log"

  # Hyperparameter Tuning Settings
  tuning:
    enabled: true
    n_trials_regression: 50
    n_trials_classification: 25
    n_trials_lgbm_classification: 40

  # Phase 3 outputs: a calibrated probability and a delay range
  calibration_method: "sigmoid"     # Platt scaling on out-of-fold predictions; isotonic overfits small data
  interval_coverage: 0.8            # target share of flights inside the 10-90% range
  conformal_intervals: true         # widen the range on validation so it really covers ~80%
  target_transforms: ["none", "log", "clip_300"]   # candidates, compared by out-of-fold MAE
  transform_min_gain: 0.01          # a transform must beat the plain target by 1% to be used
  precision_target: 0.75            # "likely delayed" when the calibrated probability reaches this precision

  target_regression: "delay_minutes"
  target_classification: "is_delayed"

  # Machine Learning Model Parameters (Default values)
  lgbm_params:
    objective: "regression_l1"
    metric: "mae"
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    verbose: -1
  lgbm_classifier_params:
    objective: "binary"
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    verbose: -1
  logistic_params:
    solver: "liblinear"
    C: 1.0
    max_iter: 200
