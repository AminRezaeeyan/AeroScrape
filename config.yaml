# MLflow Configuration
mlflow:
  tracking_uri: "http://mlflow:5000" # MLflow Tracking Server URI
  experiment_name: "flight_delay_prediction"


# Flight boards show local times; scheduled times are stored as such, and runs are named in it
timezone: "Asia/Tehran"

# Scraper Configuration
scraper:
