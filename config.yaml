  timeout_seconds: [5, 20]          # connect, read
  retries: 3                        # connection errors and 429/5xx, with exponential backoff
  delay_seconds: 1.5                # between airports
  raw_html_dir: "data/raw_html"     # every fetched page is kept here, gzipped, to re-parse later
  raw_html_retention_days: 14       # about 1 MB per run, 8 runs a day
  # A run below these counts failed somewhere; small airports' boards are often empty, so only
  # the busiest airports have a floor of their own
