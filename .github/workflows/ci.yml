name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Disposable Postgres for the database tests (tests/test_database_load.py)
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: flights
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d flights"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEROSCRAPE_TEST_DB: "1"
      AEROSCRAPE_TEST_READER: ci_reader  # password = user name, created below
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: flights
      DB_USER: ci
      DB_PASSWORD: ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Create the tables and roles with the init scripts
        env:
          PGHOST: localhost
          POSTGRES_USER: ci
          POSTGRES_DB: flights
          APP_DB_USER: ci_app
          APP_DB_PASSWORD: ci_app
          READER_DB_USER: ci_reader
          READER_DB_PASSWORD: ci_reader
          GRAFANA_DB_USER: ci_grafana
          GRAFANA_DB_PASSWORD: ci_grafana
        run: |
          psql -U ci -d flights -v ON_ERROR_STOP=1 -f init/10_init_db.sql
          for script in init/20_*.sh init/30_*.sh init/40_*.sh; do bash "$script"; done
          psql -U ci -d flights -v ON_ERROR_STOP=1 -f init/50_add_flight_updated_at.sql
          # make migrate runs these on existing databases: they must be repeatable
          bash init/40_create_monitoring.sh
          psql -U ci -d flights -v ON_ERROR_STOP=1 -f init/50_add_flight_updated_at.sql
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest -q --cov=aeroscrape --cov-report=term-missing:skip-covered

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and Airflow images
        run: |
          docker build --target runtime --build-arg EXTRAS="--extra api" -t aeroscrape/api:ci .
          docker build --target runtime --build-arg EXTRAS="--extra airflow --extra api" -t aeroscrape/airflow:ci .
      - name: Prometheus config and alert rule tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" -w /m prom/prometheus:v2.53.0 check config prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" -w /m prom/prometheus:v2.53.0 test rules alerts.test.yml
          docker run --rm --entrypoint sh -e TELEGRAM_BOT_TOKEN=123:test -e TELEGRAM_CHAT_ID=-100123 \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 /etc/alertmanager/check.sh
      - name: Smoke test
        run: |
          docker run --rm aeroscrape/api:ci python -c "import aeroscrape.serving.api"
          docker run --rm aeroscrape/airflow:ci python -c "import aeroscrape.pipeline.tasks, aeroscrape.pipeline.monitor_tasks"
          test "$(docker run --rm aeroscrape/api:ci id -u)" != 0  # runs as a non-root user
